# Publica SOLO el cliente web (carpeta cliente/) en GitHub Pages. La API vive aparte, en Render.
name: Cliente en Pages

on:
  push:
    branches: [main]
    paths: ["cliente/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cliente
      - id: publicar
        uses: actions/deploy-pages@v4
